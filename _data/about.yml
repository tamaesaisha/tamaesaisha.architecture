photo: /assets/uploads/profile.webp
intro: >-
  I’m a third-year architecture student at the University of the Witwatersrand,
  interested in designing spaces that feel considered, responsive, and genuinely
  connected to the people who use them. I’m drawn to the idea that good
  architecture sits somewhere between function and feeling. It works well, but it
  also creates atmosphere through light, air, material, and movement.
bio: >-
  My process moves between digital tools and hand drawing, using each to test and
  understand ideas rather than just represent them. I’m especially interested in
  sustainable and passive design, and how simple, thoughtful strategies can shape
  comfortable environments that respond to climate and context. Model making is an
  important method of design for me. I’m extremely passionate about it and will
  continue to use it as a tool for design. Alongside architecture, I’ve worked in
  art and graphic design, which has strengthened how I communicate ideas visually
  and approach composition with more intention.

